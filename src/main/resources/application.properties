spring.application.name=authentication_module
server.port=8080

spring.datasource.username=${AUTH_DB_USERNAME:postgres}
spring.datasource.password=${AUTH_DB_PASSWORD:}
spring.datasource.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_service}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

logging.level.root=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.mail.javamail=INFO
logging.level.com.example.authentication_module=DEBUG

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Frontend base URL used to build verification (and password reset) links in emails.
# Override with the APP_FRONTEND_BASE_URL environment variable.
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false

# Redis (token revocation + rate limiting)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# Rate limiting (fixed-window counters, see Service/RateLimiterService)
app.ratelimit.login.max-attempts=${LOGIN_RATE_MAX_ATTEMPTS:5}
app.ratelimit.login.window-minutes=${LOGIN_RATE_WINDOW_MINUTES:15}
app.ratelimit.forgot-password.max-attempts=${FORGOT_PASSWORD_RATE_MAX_ATTEMPTS:3}
app.ratelimit.forgot-password.window-minutes=${FORGOT_PASSWORD_RATE_WINDOW_MINUTES:60}
app.ratelimit.register.max-attempts=${REGISTER_RATE_MAX_ATTEMPTS:5}
app.ratelimit.register.window-minutes=${REGISTER_RATE_WINDOW_MINUTES:60}
app.ratelimit.global.max-requests=${GLOBAL_RATE_MAX_REQUESTS:60}
app.ratelimit.global.window-seconds=${GLOBAL_RATE_WINDOW_SECONDS:60}

# Google SSO (ID token verification only - no server-side redirect flow;
# the frontend obtains the idToken via Google Identity Services and posts
# it to /auth/oauth/google)
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.jwks-uri=${GOOGLE_JWKS_URI:https://www.googleapis.com/oauth2/v3/certs}